title = "KEPT secret scanning"

[extend]
useDefault = true

[[rules]]
id = "openrouter-api-key"
description = "OpenRouter API key"
regex = '''\bsk-or-v1-[a-fA-F0-9]{64}\b'''
keywords = ["sk-or-v1-"]

# Solana public addresses and transaction signatures do not match this rule.
[[rules]]
id = "solana-keypair-array"
description = "Solana private keypair stored as a 64-byte JSON array"
regex = '''\[\s*(?:(?:25[0-5]|2[0-4][0-9]|1[0-9]{2}|[1-9]?[0-9])\s*,\s*){63}(?:25[0-5]|2[0-4][0-9]|1[0-9]{2}|[1-9]?[0-9])\s*\]'''

[[rules]]
id = "kept-secret-assignment"
description = "Literal KEPT server credential"
regex = '''(?i)\b(?:SESSION_SECRET|ADMIN_SECRET|OPEN_API_KEY|VERIFIER_SECRET_KEY|FAUCET_SECRET_KEY)["']?\s*(?:\?\?=|[:=])\s*["']?([a-z0-9_+/=:.@-]{8,})'''
secretGroup = 1
keywords = ["session_secret", "admin_secret", "open_api_key", "verifier_secret_key", "faucet_secret_key"]

[[rules.allowlists]]
description = "Documented example value only"
condition = "AND"
paths = ['''(^|/)\.env\.example$''']
regexes = ['''^replace-with-at-least-32-random-bytes$''']

[[rules.allowlists]]
description = "Existing isolated backend test session credentials only"
condition = "AND"
paths = ['''(^|/)(backend|apps/api)/test/(photoRoutes|recentlyOut)\.test\.ts$''']
regexes = ['''^(photo-routes|recently-out)-test-secret$''']
